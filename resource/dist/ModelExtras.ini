[FEATURES]
// Vehicles with animated chains (bikes, bicycles, cars etc)
AnimatedChain = True

// Animated sliding & rotating doors
AnimatedDoors = True

// Dashboard gas meter for vehicles
AnimatedGasMeter = True
// Animated gear meter for the dashboard that moves when the player is changing gears
AnimatedGearMeter = True
// Animated odometer for the dashboard that moves when the player is driving
AnimatedOdoMeter = True
// Animated rpm meter for the dashboard that indicates engine rpm
AnimatedRpmMeter = True	
// Animated speed meter for the dashboard that indicates players speed
AnimatedSpeedMeter = True
// Animated spoilers that move when the player is accelerating or braking
AnimatedSpoiler = True
// Animated turbo meters for the dashboard of the vehicle
AnimatedTurboMeter = True

// Sparks come out of the vehicle exhaust when the player is accelerating
BackfireEffect = True
// Backfire effect for selected vehicles only (check BackFireEffect_VehicleModels)
BackfireEffect_OnlySelectedModels = True

// Animating vehicle rooftops
ConvertibleRoof = True

// Dashboard LED lights for vehicles (engine on, indicators, reverse etc)
DashboardLED = True

// Digital Clock for the dashboard
DigitalClock = True

// Enables the vehicle dirt effect (dirt on the vehicle body)
DirtFX = True

// Enables support for vehicle exhaust/smoke effects
ExhaustFx = True

// Enables support for additional wheels for automobiles
ExtraWheels = True

// Custom carcols loader.
Carcols = True

// Improved license plates for vehicles
HDLicensePlate = True

// Coronas for lights (standard, siren, spotlights etc)
LightCoronas = True 

// Shadows for lights (standard, siren, spotlights etc)
LightShadows = True

// Ped variation colors like VCS
PedCols = True

// Rollback bed for pickup trucks
RollbackBed = True

// The wheel hubs rotate along with the wheels (Only for automobiles)
RotatingWheelHubs = True

// Sirens for emergency vehicles
SirenLights = True

// Disables all of the following features at once
SoundEffects = True
// Plays a engine air break sound for BIG vehicles (check SoundEffects_BigVehicleModels) (Bus, Coach, Linerunner etc)
SoundEffects_GlobalAirbreakSound = True
// Plays a engine on/off sound
SoundEffects_GlobalEngineSound = True
// Plays a indicator on/off sound
SoundEffects_GlobalIndicatorSound = True
// Plays a reverse sounds for BIG vehicles (check SoundEffects_BigVehicleModels) (Bus, Coach, Linerunner etc)
SoundEffects_GlobalReverseSound = True
// Plays sound effects for traffic vehicles too
SoundEffects_NonPlayerVehicles = True

// SpotLights for emergency vehicles
SpotLights = True

// Lights for vehicles (headlights, taillights, indicators etc)
StandardLights = True

// Use the new refactored StandardLights (Still WIP, features may be unavailable)
StandardLightsv2 = False

// Renders indicator (turn) lights for non adapted vehicles
StandardLights_GlobalIndicatorLights = True

// Remaps textures for vehicles 
TextureRemaper = True

[VISUAL] 
// Default values for light source
LightCoronaSize = 0.3 	
LightCoronaIntensity = 50
LightShadowIntensity = 50   

// Specific values for taillight coronas
TailLightCoronaSize = 1.4
TailLightCoronaIntensity = 60

// How much the material responds to sunlight (0.45 = default, 50.0 = fully lit at night)
MaterialAmbientOff = 0.45
MaterialAmbientOn = 50.0

[CONFIG]
// Also enables MERELOAD cheat (Reloads config data of current player vehicle)
DeveloperMode = False

// Version check for ModelExtras models (Recommended to keep it enabled)
ModelVersionCheck = True

// Log extra info in log, might cause performance issues (Useful for developers)
VerboseLogging = False

[TWEAKS]
// Coronas will be scaled by this multiplier when vehicle is at a distance during night time
// Set to 0.0 to disable this effect
CoronaDistanceMul = 0.0

// Foglights will only turn on when headlights are active
FoglightTiedToHeadlight = True

// How much further the high beam lights up peds, vehicles and the road
// 1.0 matches the low beam, allowed range is 1.0 to 4.0
HighBeamPointLightMul = 2.0

// ImVehFt light height limit, set to 0.0 to disable 
LightHeightLimit = 0.5

// Multiplier for ModelExtras audio effects
SoundMult = 1.0

[KEYS]
// Check https://www.ascii-code.com/ for key codes

// Default key is J
FogLightKey = 0x4A 

// Default key is X
IndicatorLightBothKey = 0x58
// Default key is Z
IndicatorLightLeftKey = 0x5A
// Default key is LShift
IndicatorLightNoneKey =  0x10 
// Default key is C
IndicatorLightRightKey = 0x43

// Default key is G
LongLightKey = 0x47

// Default key is K
RollbackBedToggleKey = 0x4B

// Default Key is T
RoofToggleKey = 0x54

// Default key is L
SirenLightKey = 0x4C

// Default key is B
SpotLightKey = 0x42


[TABLE]
SoundEffects_BigVehicleModels = "403, 406, 407, 408, 416, 427, 431, 433, 437, 443, 455, 486, 508, 514, 515, 524, 544, 578"
BackFireEffect_VehicleModels = "402, 411, 415, 429, 451, 475, 477, 480, 494, 496, 502, 503, 506, 541, 558, 559, 565, 587, 589, 603, 604"
