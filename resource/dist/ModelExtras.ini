####################################################################################################
## ModelExtras v3.1 Configuration File                                                            ##
## Authors: Grinch_, Caner Karaca, Ameer, KaiQ                                                    ##
## ---------------------------------------------------------------------------------------------- ##
## Discord Server & Support       : https://discord.gg/AduJVdyqCD                                 ##
## Vehicle Adaptation & Wiki Guide: https://github.com/user-grinch/ModelExtras/wiki               ##
## ---------------------------------------------------------------------------------------------- ##
## In-Game Live Controls:                                                                         ##
##   - Type 'MERELOAD' in-game to reload configuration and vehicle data without restarting        ##
##   - Press 'CTRL + Z' in-game to open the Studio & Workshop overlay to customize in real-time   ##
####################################################################################################

[FEATURES]
AnimatedChain                     = 1       # Vehicles with animated chains (bikes, bicycles, cars, etc.)
AnimatedDoors                     = 1       # Animated sliding & rotating doors
AnimatedGasMeter                  = 1       # Dashboard gas meter for vehicles
AnimatedGearMeter                 = 1       # Dashboard gear meter that moves when changing gears
AnimatedOdoMeter                  = 1       # Dashboard odometer that tracks distance driven
AnimatedRpmMeter                  = 1       # Dashboard RPM meter that indicates engine revs
AnimatedSpeedMeter                = 1       # Dashboard speedometer that indicates vehicle speed
AnimatedSpoiler                   = 1       # Animated spoilers that move when accelerating or braking
AnimatedTurboMeter                = 1       # Dashboard turbo meters for vehicles
BackfireEffect                    = 1       # Sparks and flames come out of exhaust when accelerating
BackfireEffect_OnlySelectedModels = 1       # Backfire effect for selected vehicles only (check [TABLE])
Carcols                           = 1       # Custom carcols loader (automatically disabled in SA-MP)
ConvertibleRoof                   = 1       # Animating vehicle rooftops
DashboardLED                      = 1       # Dashboard LED lights for vehicles (engine, indicators, reverse, etc.)
DigitalClock                      = 1       # Digital clock for the dashboard showing current time
DirtFX                            = 1       # Vehicle dirt effect (dirt on the vehicle body)
ExhaustFx                         = 1       # Vehicle exhaust/smoke effects
ExtraWheels                       = 1       # Support for additional wheels for automobiles
HDLicensePlate                    = 1       # Improved license plates for vehicles
Neon                              = 1       # Vehicle neon lights
PedCols                           = 1       # Ped variation colors like VCS
RollbackBed                       = 1       # Rollback bed for pickup trucks
RotatingWheelHubs                 = 1       # Wheel hubs that rotate along with the wheels
TextureRemapper                   = 1       # Remaps textures for vehicles

[LIGHTS]
GlobalIndicatorLights             = 1       # Renders indicator (turn) lights for non-adapted vehicles
AutoIndicatorsOnSteer             = 0       # Automatically activates turn indicators while steering
PlayerIdleBrakeLights             = 0       # Automatically keep player vehicle brake lights on while stopped and idling
HeadLightBeams                    = 1       # Light beam effect from vehicle headlights
Lights                            = 1       # Lights for vehicles (headlights, taillights, indicators, etc.)
LightCoronas                      = 1       # Coronas for lights (standard, siren, spotlights, etc.)
LightCoronaSize                   = 0.3     # Standard base of coronas size for turn and other lights
LightCoronaIntensity              = 80      # Standard base of coronas brightness for turn and other lights (0 - 255)
LightCoronaDistanceMul            = 0.07    # General scale for other vehicle coronas at distance during night time (0.0 to disable)
LightShadows                      = 1       # Shadows for lights (standard, siren, spotlights, etc.)
LightShadowSizeMul                = 1.0     # Size multiplier of projected ground shadows for turn and other lights
LightShadowIntensity              = 80      # Standard base opacity of projected ground shadows/light pools for turn and other lights (0 - 255)
LightShadowDistance               = 120.0   # Maximum draw distance for vehicle ground light shadows
LightPointLights                  = 1       # Dynamic point lights on ground and surroundings for vehicle lights
LightPointLightSizeMul            = 1.0     # Size/radius multiplier for vehicle dynamic point lights (0.1 to 5.0)
LightPointLightOffsetMul          = 1.0     # Offset multiplier pushing dynamic point lights away from vehicle body (0.0 to 5.0)
SirenLights                       = 1       # Sirens for emergency vehicles
SirenCoronas                      = 1       # Coronas for emergency vehicle sirens
SirenCoronaDistanceMul            = 0.07    # Scales siren coronas at distance during night time (0.0 to disable)
SirenShadows                      = 1       # Shadows for emergency vehicle sirens
SirenPointLights                  = 0       # Dynamic point lights for emergency vehicle sirens
SirenPointLightSizeMul            = 1.0     # Size/radius multiplier for emergency siren point lights (0.1 to 4.0)
SirenPointLightOffsetMul          = 1.0     # Offset multiplier pushing emergency siren point lights away from vehicle body (0.0 to 5.0)
HeadLightCoronaSize               = 0.4     # Corona size for headlights
HeadLightCoronaIntensity          = 80      # Corona brightness for headlights (0 - 255)
HeadLightCoronaDistanceMul        = 0.07    # Scales headlight coronas at distance during night time (0.0 to disable)
HeadLightShadowSizeMul            = 1.0     # Size multiplier of projected ground shadows for headlights
HeadLightShadowIntensity          = 80      # Opacity of projected ground shadows for headlights (0 - 255)
TailLightCoronaSize               = 0.4     # Corona size for taillights
TailLightCoronaIntensity          = 60      # Corona brightness for taillights (0 - 255)
TailLightCoronaDistanceMul        = 0.05    # Scales taillight/brakelight coronas at distance during night time (0.0 to disable)
TailLightShadowSizeMul            = 1.0     # Size multiplier of projected ground shadows for taillights
TailLightShadowIntensity          = 80      # Opacity of projected ground shadows for taillights (0 - 255)

[SOUND]
SoundEffects                      = 1       # Master toggle for all ModelExtras sound effects
SoundMult                         = 0.6     # Multiplier for ModelExtras audio effects (0.0 to 1.0)
NonPlayerVehicles                 = 1       # Plays sound effects for traffic vehicles too
AirbreakSound                     = 1       # Plays engine air brake sound for big vehicles (check [TABLE])
BrakePadOnlySelected              = 1       # Brake pad squeak for selected vehicles only (check [TABLE])
BrakePadSound                     = 0       # Plays brake pad squeak sound for automobiles when braking (check [TABLE])
DoorChimeOnlySelected             = 1       # Open door warning chime for selected vehicles only (check [TABLE])
DoorChimeSound                    = 1       # Plays open door warning chime sound for vehicles (check [TABLE])
EngineSound                       = 1       # Plays engine on/off sound
IndicatorSound                    = 1       # Plays indicator on/off sound
ReverseSound                      = 1       # Plays reverse sound for big vehicles (check [TABLE])

[CONFIG]
EnableLiveReload                  = 1       # Enables the 'MERELOAD' cheat to live-reload vehicle configs and INI settings without restarting
ModelVersionCheck                 = 1       # Version check for ModelExtras models (recommended to keep enabled)
ModLoaderData                     = 1       # Loads per-vehicle data configs (.jsonc/.json/.eml/.ivfc) directly from ModLoader subfolders
EnableLogging                     = 1       # Writes diagnostic log messages to 'ModelExtras.log'
VerboseLogging                    = 0       # Log extra info in log file, might cause performance issues (for developers)

[KEYS]
# Key codes reference: https://www.ascii-code.com/
FogLightKey                       = 0x4A    # Toggle fog lights (Default: J [0x4A])
IndicatorLightBothKey             = 0x58    # Toggle hazard warning lights / both indicators (Default: X [0x58])
IndicatorLightLeftKey             = 0x5A    # Toggle left turn indicator (Default: Z [0x5A])
IndicatorLightRightKey            = 0x43    # Toggle right turn indicator (Default: C [0x43])
IndicatorLightNoneKey             = 0x10    # Turn off all indicators (Default: LShift [0x10])
LongLightKey                      = 0x47    # Toggle high beams / long lights (Default: G [0x47])
RollbackBedToggleKey              = 0x4B    # Extend / retract rollback flatbed ramp on tow trucks (Default: K [0x4B])
RoofToggleKey                     = 0x54    # Open / close convertible vehicle roof (Default: T [0x54])
SirenLightKey                     = 0x4C    # Toggle emergency siren light mode & mute siren audio (Default: L [0x4C])
SpotLightKey                      = 0x42    # Toggle police searchlight / spotlight on / off (Default: B [0x42])
ImGuiKey                          = 0x5A    # Toggle ImGui menu / Studio (Default: Z [0x5A])
ImGuiKeyCombination               = 0x11    # Combination modifier key (Default: Ctrl [0x11], 0x00 = Single key / None)

